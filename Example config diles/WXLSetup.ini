; WXLExtendedEquipment.ini
; Lives beside WarcraftXL.dll itself -- i.e. the game's own root folder, since that's where
; WarcraftXL.dll is loaded from (this module is built into WarcraftXL.dll, there is no separate
; WXLExtendedEquipment.dll). Any value that isn't a nonzero integer (including a missing
; key/section/file) is treated as the default shown below.

[EagerPreload]
; Bake every sidecar-known weapon displayId at startup, ahead of the char-select preview.
; Safe to turn off: OnItemSlotChange/OnWeaponVisualChange/OnItemDisplayLookup already patch a
; weapon reactively the moment it's actually equipped, eager preload only gets you there sooner.
Weapons=0

; Bake every sidecar-known creature displayId at startup, ahead of the first spawn/preview model.
; Safe to turn off: unlike weapons, creature models have a genuine lazy fallback too (baked on
; first VirtualProvide miss instead of at startup), so nothing goes unpatched either way -- turning
; this off just trades "pay the cost for every sidecar entry at startup" for "pay it once per
; displayId, the first time it's actually requested".
Creatures=0

[Memory]
; Soft cap, in megabytes, on the combined size of all baked creature model overrides kept resident
; at once (raw .m2 + .skin bytes, NOT the client's own in-engine parsed copy of them -- the actual
; memory cost per creature is higher than this number alone suggests). Once exceeded, the
; least-recently-served creature entries are evicted to make room for new ones; an evicted entry is
; simply rebaked (see CreatureLazyResolve) the next time something actually asks for it again --
; not lost, just paid for again on demand. Currently-visible creatures are unaffected by an
; eviction: by the time the client is rendering one, it already has its own copy of the geometry,
; independent of this table.
;
; <= 0 (or this key/section/file missing entirely) means uncapped -- entries are still tracked, just
; never actually evicted. Only applies to creature entries; weapon overrides are never evictable.
MaxCreatureCacheMB=128
MaxWeaponCacheMB=64

; To see what the camera is doing, turn WXL logging on too and read WXL.log (category CULL):
[Log]
Enabled=1       
; master switch, as before
ModernM2=0      
; category M2
Equip=0         
; categories EQUIP, SIDECAR, VPATH
Physics=0      
; category PHYS
Creature=0      
; category CREATURE
Weapon=0        
; category WEAPON

[Culling]
; ---- ROUND 1: find out WHICH stage hides the WMO. Leave all the switches at 0 and only trace. ----
; Reproduce the problem once, then read WXL.log: it says, per WMO group and per M2 object, the stage that
; dropped it and the camera position at that moment. "has just DISAPPEARED" marks the frame the whole
; WMO went. TraceWmo / TraceModel take a part of the file path (any case); "*" = everything (chatty).
TraceWmo=stormwind

; --- Portal culling ---------------------------------------------------------------------------------------
; Stock: a WMO group flagged indoor is only drawn by walking portals (from outside: from an exterior group's
; portals; from inside: from the camera's group). A group with no portal chain to one of those is never drawn,
; and the M2 doodads it places go with it.
; 1 = every group is culled only by its own bounding box (view frustum, occlusion volumes, horizon buffer) and
; drawn whenever that passes, portals or not. Costs draw calls: indoor groups out of any portal's sight are
; drawn and hidden by the depth buffer. Not part of the master switch.
DisablePortalCulling=1

; --- Other switches (all default 0) -----------------------------------------------------------------------
; DisableWmoCulling=0         master: horizon buffer + WMO occluders + occlusion volumes + "camera inside a WMO
;                             hides the outside"
; DisableViewerWmoCull=0      being inside a WMO no longer drops the outside world
; DisableWmoOccluders=0       WMO groups no longer hide what is behind them
; DisableOcclusionVolumes=0   the hardcoded volumes (e.g. the Stormwind wall) are not built
; DisableHorizonBuffer=0      nothing is hidden behind terrain / occluders (same as the console "showCull")
; DisableWmoFrustumCull=0     exterior WMO groups are never rejected by the view frustum (bisecting only)
; DisableSceneBoxCull=0       WMO groups are never rejected for being outside the scene box (bisecting only)

; Add to WXLExtendedEquipment.ini (beside the client executable). Read at start-up; with WatchIni=1 they are
; re-read every time the ini is saved. Every multiplier: 1.0 = as the .phy2 has it. Decimals: 1.25 or 1,25.
; A missing or blank key is 1.0. Values outside a key's range are clamped, non-numbers ignored; both are logged
; in WXL.log (category PHYS) when [Log] Enabled=1.




;; ---- how the bones fall and settle (dynamic bodies) 1.0 default ----
;GravityScale=0.5           ; pull down. 0 = the parts float where the model puts them
;LinearDampingScale=1.0      ; drag on movement.  Up: settles sooner, gooier.  Down: swings longer.   (0 .. 100)
;AngularDampingScale=1.0     ; drag on turning / twisting.                                           (0 .. 100)
;InertiaScale=1.0            ; resistance to being rotated. Up: lazier turns.                       (0.01 .. 100)
;MassScale=1.0               ; weight of the parts (shape density)                                  (0.01 .. 100)
;; ---- contacts (every shape) ----
;FrictionScale=100.0           ; grip against the collider.  Up: sticks.  Down: slides.               (result 0 .. 10)
;RestitutionScale=0.0        ; bounce                                                                (result 0 .. 1)
;; ---- joint limits: how far a bone may bend ----
;SwingLimitScale=1.0        ; shoulder-joint cone                                                   (result 10 .. 170 degrees)
;TwistLimitScale=1.0         ; shoulder twist and revolute range, about their centre. 0 = tight (~0.5 degree), never "free"
;; ---- joint springs: only joints whose .phy2 value has a motor torque (the staff has none: no effect) ----
;JointStiffnessScale=1.0
;JointDampingScale=1.0
;MotorTorqueScale=1.0
;; ---- following a fast move ----
;FollowScale=2.0            ; how much of a fast move of the item the anchors take at once (carry)  (result 0 .. 1)
;; ---- tuning without restarting: re-read the keys whenever this file is saved (parts snap back for a moment) ----
;WatchIni=1
; ---- tuning without restarting: re-read the keys whenever this file is saved (parts snap back for a moment) ----
[Physics]
Enabled=1
WatchIni=1
GravityScale=0.5           
LinearDampingScale=1.0      
AngularDampingScale=1.0     
InertiaScale=1.0            
MassScale=1.0               
; ---- contacts (every shape) ----
FrictionScale=100.0           
RestitutionScale=0.01        
; ---- joint limits: how far a bone may bend ----
SwingLimitScale=1.0        
TwistLimitScale=1.0         
; ---- joint springs: only joints whose .phy2 value has a motor torque (the staff has none: no effect) ----
JointStiffnessScale=1.0
JointDampingScale=1.0
MotorTorqueScale=1.0
; ---- following a fast move ----
FollowScale=2.0            
; Gravity multiplier while the unit is underwater. It REPLACES GravityScale
; there (not multiplied). 1 = the file's own gravity, 0 = weightless,
; negative = parts float up.
Buoyancy=-0.1

[Physics.Underwater]
Enabled=1
; GravityScale and Buoyancy are NOT used in this section.
; water drag, stacks on the values above
LinearDampingScale=1
AngularDampingScale=1
; seconds to ease in/out after entering or leaving the water
BlendSeconds=0.4
SurfaceDepth=0.75   
  ; the water level: no underwater effect, parts fall normally
FullDepth=1.0       
  ; about when the head goes under: full effect


[Modules] 
Enabled=1 ;(predefinito)  Disable=wxl_physics.dll.


[Animation]
ScalePrecastToCastTime=1
LoopShorterAnimations=0   
; 1 = loop shorter precasts instead of stretching them
PrecastMinSpeed=0.5
PrecastMaxSpeed=10.0

[Outline]
Enabled=1
Debug=0
Spread=2.0      
; halo width in frame pixels
Intensity=2.0   
; halo opacity multiplier
Quest=1            
; new: always-on quest outline
QuestColor=00C8FF    
; RRGGBB
QuestThroughWalls=1  
; 1 = show through walls
HideBehindObjects=0  
; 0 = current behavior (default)
QuestTurnIn=1            
; new, default 0
QuestTurnInColor=FFD200  
; new, gold by default
HostileColor=FF0000    
; mouseover/target, unit hostile or hated toward you
NeutralColor=FFFF00    
; unfriendly or neutral
FriendlyColor=00FF00   
; friendly and above
Tracked=1                       
; master switch, default 0
TrackedObjects=1                
; nodes, mailboxes
TrackedCreatures=1
TrackedNpcs=1
TrackedObjectColor=FFA040       
; amber
TrackedCreatureColor=FF40FF     
; magenta
TrackedNpcColor=FFFFFF          
; white
TrackedRange=80                 
; yards from you, 0 = every visible one
TrackedThroughWalls=1         
; defaults to your QuestThroughWalls value
DepthTolerance=4.0   
; scales the bias; raise it (2, 4...) if outlines still vanish with nothing in the way,
; lower it (0.25, 0) if they show through thin things right in front

[Water]
Enabled=0

[SpellArea]
; master switch. 0 = nothing is drawn. The ini is re-read about once a second, so saving the file toggles it live.
Enabled=1
EnemiesOnly=0
; --- whose spells ---
; your own spells and the areas you put on the ground
Own=1
; everybody else's too (an enemy casting an area spell shows where it will land)
Others=1

; --- what is shown ---
; the area of a spell that is being cast (fades in as the cast goes on)
Precast=1
; the area of a spell that is being channeled (Hellfire, Tranquility, ...)
Channel=1
; areas lying on the ground: Blizzard, Consecration, Death and Decay, Rain of Fire, boss ground effects
Persistent=1
; cone spells (Cone of Cold, ...)
Cones=1

; --- looks ---
; 0.05 .. 1
Opacity=0.65
; RRGGBB. Areas that hit enemies:
HarmfulColor=FF3C28
; areas that help friends (party, raid, ally targets, area auras):
HelpfulColor=3CFF5A
; everything else:
NeutralColor=FFC83C

; ceiling for every indicator, applied last (0.05 .. 1)
MaxOpacity=1.0
; chain spells show the circle of their first jump
Chain=1
; jump radius for a chain spell whose data gives none (1 .. 60 yards)
ChainRadius=12.5

; --- shape rules ---
; degrees, 5 .. 180. One angle for every cone spell (the spell data has none); a CSV row can set one per spell.
ConeAngle=90
; areas with a smaller radius, in yards, are not drawn (0.1 .. 50)
MinRadius=1.0
; bigger areas are drawn at this size (MinRadius .. 150)
MaxRadius=60
; at most this many shapes at once, 1 .. 64. Each one costs a terrain query.
MaxAreas=16

; --- per-spell fixes: lines, odd cones, hiding a spell ---
; file beside the client executable (a full path also works)
OverrideFile=SpellAreaOverride.csv
JumpDistanceFile=SpellJumpDistance.csv
ConeFile=SpellCone.csv