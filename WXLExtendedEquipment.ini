; WXLExtendedEquipment.ini - put it next to the client executable (the same folder as WarcraftXL.dll).
; Comments go on their own line (start the line with ;). Every key is optional: a missing key keeps its default.

; ---------------------------------------------------------------------------------------------------------------
; [Modules]  the DLLs in WXL\Modules
; ---------------------------------------------------------------------------------------------------------------
[Modules]
; 1 loads them (default), 0 loads none
Enabled=1
; DLL file names to skip, separated by ;   e.g. Disable=a.dll;b.dll
Disable=

; ---------------------------------------------------------------------------------------------------------------
; [Log]  WXL.log, written next to the client, truncated at every launch. Off unless Enabled=1.
; ---------------------------------------------------------------------------------------------------------------
[Log]
Enabled=1
; with logging on, 0 silences one module's lines (all default to 1)
ModernM2=1
Equip=1
Physics=1
Creature=1
Weapon=1

; ---------------------------------------------------------------------------------------------------------------
; [Physics]  loose parts of weapons and creature/mount models (needs a .phy2 beside the model)
; ---------------------------------------------------------------------------------------------------------------
[Physics]
Enabled=1
; re-read this section, [Physics.Underwater] and PhysicsOverride.csv whenever they are saved (checked once a second;
; the parts snap back to their pose for a moment)
WatchIni=1

; ---- stuck items (jump, stairs) ----
; give every extra anchor of a model its followers (recommended)
CarryAnchors=1
; re-seed a part that stays far from where the animation puts it
Unstick=1
; how far that is, in percent of its distance to the nearest anchor
UnstickReach=300
; a placement that moves more than this many yards in one frame is a teleport
TeleportYards=6

; ---- the multipliers below scale what each model's .phy2 says: 1.0 = as the file has it ----
; ---- how the bones fall and settle (dynamic bodies) ----
; pull down. 0 = the parts float where the model puts them. Negative (down to -100): they rise.
GravityScale=0.5
LinearDampingScale=1.0
AngularDampingScale=1.0
InertiaScale=1.0
MassScale=1.0

; ---- contacts (every shape) ----
FrictionScale=100.0
RestitutionScale=0.0

; ---- joint limits: how far a bone may bend ----
SwingLimitScale=1.0
TwistLimitScale=1.0

; ---- joint springs: only joints whose .phy2 value has a motor torque ----
JointStiffnessScale=1.0
JointDampingScale=1.0
MotorTorqueScale=1.0

; ---- following a fast move ----
FollowScale=2.0

; ---------------------------------------------------------------------------------------------------------------
; [Physics.Underwater]  the same multipliers, applied ON TOP of the ones above (or of a PhysicsOverride.csv row)
; while the unit is swimming. Items in its hands and a rider on a mount change with it.
; ---------------------------------------------------------------------------------------------------------------
[Physics.Underwater]
; 0 switches this section off without deleting it (default 1)
Enabled=1
; the effective gravity underwater is (global or CSV value) x this: 0.5 x -0.2 = -0.1, the parts drift up
GravityScale=-0.2
LinearDampingScale=6
AngularDampingScale=6
; seconds the change takes after the unit enters or leaves the water (0 = at once, default 0.4, max 10)
BlendSeconds=0.4
